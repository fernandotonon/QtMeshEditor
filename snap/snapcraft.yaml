name: qtmesheditor
adopt-info: qtmesheditor
title: QtMeshEditor
summary: Free 3D asset tool for indie game developers
description: |
  Merge Mixamo animations, convert between 40+ 3D formats, edit materials
  with AI assistance, and inspect skeletons and bone weights. Supports FBX,
  glTF, OBJ, Collada, STL and more. Includes CLI for batch processing and
  an MCP server for AI agent integration.
license: MIT
contact: https://github.com/fernandotonon/QtMeshEditor/issues
issues: https://github.com/fernandotonon/QtMeshEditor/issues
source-code: https://github.com/fernandotonon/QtMeshEditor
website: https://fernandotonon.github.io/QtMeshEditor

grade: stable
confinement: strict
base: core24

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# Suppress lint warnings for optional Qt QML style plugins whose
# style-specific libraries are not bundled (we only use Basic style)
lint:
  ignore:
    - library:
      - usr/share/qtmesheditor/qml/**

# GPU driver access via mesa-core24 content snap
plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-core24

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    bind: $SNAP/gpu-2404/drirc.d

apps:
  qtmesheditor:
    command: usr/share/qtmesheditor/qtmesheditor
    plugs:
      - opengl
      - gpu-2404
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - home
      - network
      - removable-media
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/qtmesheditor:$SNAP/usr/share/qtmesheditor/platforms:$SNAP/gpu-2404/lib:$SNAP/gpu-2404/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$LD_LIBRARY_PATH
      QML2_IMPORT_PATH: $SNAP/usr/share/qtmesheditor/qml:$QML2_IMPORT_PATH
      QT_QPA_PLATFORM: xcb
      QT_PLUGIN_PATH: $SNAP/usr/share/qtmesheditor
      OGRE_PLUGIN_DIR: $SNAP/usr/lib/qtmesheditor
      LIBGL_DRIVERS_PATH: $SNAP/gpu-2404/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/dri
      __EGL_VENDOR_LIBRARY_DIRS: $SNAP/gpu-2404/share/glvnd/egl_vendor.d

  qtmesh:
    command: usr/share/qtmesheditor/qtmesheditor --cli
    plugs:
      - home
      - removable-media
      - opengl
      - gpu-2404
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/qtmesheditor:$SNAP/usr/share/qtmesheditor/platforms:$SNAP/gpu-2404/lib:$SNAP/gpu-2404/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$LD_LIBRARY_PATH
      QT_QPA_PLATFORM: offscreen
      QT_PLUGIN_PATH: $SNAP/usr/share/qtmesheditor
      LIBGL_DRIVERS_PATH: $SNAP/gpu-2404/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/dri
      __EGL_VENDOR_LIBRARY_DIRS: $SNAP/gpu-2404/share/glvnd/egl_vendor.d

parts:
  qtmesheditor:
    plugin: dump
    source: .
    override-build: |
      # If a local .deb is provided (CI), use it; otherwise download from GitHub
      if [ -f "$CRAFT_PART_SRC/qtmesheditor_amd64.deb" ]; then
        echo "Using local .deb from CI"
        dpkg-deb -x "$CRAFT_PART_SRC/qtmesheditor_amd64.deb" "$CRAFT_PART_INSTALL"
      else
        echo "Downloading .deb from latest GitHub release"
        DEB_URL=$(curl -s https://api.github.com/repos/fernandotonon/QtMeshEditor/releases/latest \
          | grep "browser_download_url.*\.deb" | cut -d '"' -f 4)
        if [ -z "$DEB_URL" ]; then
          echo "ERROR: Could not find .deb in latest release" >&2
          exit 1
        fi
        curl -L -o /tmp/qtmesheditor.deb "$DEB_URL"
        dpkg-deb -x /tmp/qtmesheditor.deb "$CRAFT_PART_INSTALL"
      fi

      # Extract version from the .deb control metadata
      DEB_PATH="$CRAFT_PART_SRC/qtmesheditor_amd64.deb"
      if [ ! -f "$DEB_PATH" ]; then
        DEB_PATH="/tmp/qtmesheditor.deb"
      fi
      VERSION=$(dpkg-deb -f "$DEB_PATH" Version)
      craftctl set version="$VERSION"

      # Fix plugins.cfg to use snap-relative path
      if [ -f "$CRAFT_PART_INSTALL/usr/share/qtmesheditor/cfg/plugins.cfg" ]; then
        sed -i 's|^PluginFolder=.*|PluginFolder=|' \
          "$CRAFT_PART_INSTALL/usr/share/qtmesheditor/cfg/plugins.cfg"
      fi
    stage-packages:
      # GL/EGL loaders (libglvnd) — stable API dispatchers.
      # GPU implementations come from mesa-core24 content snap at runtime.
      - libglvnd0
      - libglx0
      - libegl1
      - libgl1
      - libgles2
      - libglu1-mesa
      # X11 / XCB
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxext6
      - libxrandr2
      - libxrender1
      - libxi6
      - libxfixes3
      - libxdamage1
      - libxcomposite1
      - libxcursor1
      - libxtst6
      - libxkbcommon0
      - libxkbcommon-x11-0
      # Core system libs
      - libfreetype6
      - libfontconfig1
      - libgomp1
      - libcurl4t64
      - libzstd1
      - zlib1g
      - libicu74
      - libdbus-1-3
      - libsm6
      - libice6
