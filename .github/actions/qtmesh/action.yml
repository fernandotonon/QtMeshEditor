name: 'qtmesh'
description: 'Run qtmesh CLI for 3D mesh operations (info, convert, fix, anim, scan)'

inputs:
  command:
    description: 'Subcommand: info, fix, convert, anim, validate, lod, pose, scan'
    required: true
  input-file:
    description: 'Input file or directory path (relative to workspace)'
    required: true
  output-file:
    description: 'Output file path (for convert/fix/anim rename/merge)'
    required: false
  options:
    description: 'Additional flags (e.g. --json, --all, --list)'
    required: false
  image-tag:
    description: 'Docker image tag to use'
    required: false
    default: 'latest'
  qtmesh-token:
    description: 'Optional. Sets QTMESH_TOKEN in the container for QtMesh Cloud.'
    required: false
  qtmesh-api-base:
    description: 'Optional. Sets QTMESH_API_BASE in the container.'
    required: false

outputs:
  result:
    description: 'Command stdout'
    value: ${{ steps.run.outputs.result }}

runs:
  using: 'composite'
  steps:
    - id: run
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_FILE: ${{ inputs.input-file }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_QTMESH_TOKEN: ${{ inputs.qtmesh-token }}
        INPUT_QTMESH_API_BASE: ${{ inputs.qtmesh-api-base }}
      run: |
        # Build command args safely via arrays to prevent injection
        cmd=("$INPUT_COMMAND" "/workspace/$INPUT_FILE")
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          cmd+=("-o" "/workspace/$INPUT_OUTPUT_FILE")
        fi
        if [ -n "$INPUT_OPTIONS" ]; then
          read -r -a opts <<< "$INPUT_OPTIONS"
          cmd+=("${opts[@]}")
        fi

        docker_env=()
        if [ -n "${INPUT_QTMESH_TOKEN:-}" ]; then
          docker_env+=(--env "QTMESH_TOKEN=${INPUT_QTMESH_TOKEN}")
        fi
        if [ -n "${INPUT_QTMESH_API_BASE:-}" ]; then
          docker_env+=(--env "QTMESH_API_BASE=${INPUT_QTMESH_API_BASE}")
        fi

        OUTPUT=$(docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "${{ github.workspace }}:/workspace" \
          "${docker_env[@]}" \
          "ghcr.io/fernandotonon/qtmesh:${{ inputs.image-tag }}" \
          "${cmd[@]}")

        echo "result<<EOF" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
