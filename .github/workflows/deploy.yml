####################################################################
# Snap Store Publish (after Linux .deb is built)
####################################################################

 snap-publish:
    needs: build-linux
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3.5.3

    - uses: actions/download-artifact@v4
      with:
        name: linux-binaries
        path: .

    - name: Verify snap input artifact
      run: test -f ./qtmesheditor_amd64.deb

    - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
      id: build

    - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
      with:
        snap: ${{ steps.build.outputs.snap }}
        release: stable

####################################################################
# Docker Image Publish (after Linux .deb is built)
####################################################################

 docker-publish:
    needs: build-linux
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_GHCR: ghcr.io
      GHCR_IMAGE: fernandotonon/qtmesh
      DOCKERHUB_IMAGE: fernandotr1/qtmesh
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact from build-linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: .

      - name: Prepare .deb for Docker build
        run: |
          shopt -s nullglob
          debs=(./*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb, found ${#debs[@]}" >&2
            ls -la ./*.deb 2>/dev/null || true
            exit 1
          fi
          mv "${debs[0]}" ./qtmesheditor.deb
          ls -la ./qtmesheditor.deb

      - name: Extract version from downloaded package
        id: version
        run: |
          VERSION=$(dpkg-deb -f ./qtmesheditor.deb Version | sed 's/-.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:${VERSION}"
          TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:latest"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:${VERSION}"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=qtmesh
            org.opencontainers.image.description=qtmesh CLI - 3D mesh conversion, optimization, and animation tools
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/fernandotonon/QtMeshEditor

      - name: Verify image
        run: |
          IMAGE="${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}"
          # Check for missing shared libraries before running
          echo "=== Checking for missing shared libraries ==="
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'LD_LIBRARY_PATH=/usr/lib/qtmesheditor ldd /usr/share/qtmesheditor/qtmesheditor 2>&1 | grep "not found" && exit 1 || echo "All libraries found"'
          # Run --help to verify CLI works end-to-end
          docker run --rm "$IMAGE" --help
