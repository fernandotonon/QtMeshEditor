name: Deploy

on: 
   push:
      branches: [ "master" ]
   pull_request:
      branches: [ "master" ]
   release:
      types: [published]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  AQT_VERSION: '==3.3.*'
  QT_VERSION: '6.9.1'
  ASSIMP_VERSION: '6.0.2'
  ASSIMP_DIR_VERSION: '6.0'
  OGRE_VERSION: '14.4.1'

jobs:
#  send-slack-notification:
#    runs-on: ubuntu-latest
#    steps:
#       - name: send slack message
#         uses: docker://technosophos/slack-notify
#         env:
#             SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
#             SLACK_MESSAGE: "Building QtMeshEditor in GitHub Actions - works! :D"

####################################################################
# Windows Deploy
####################################################################

 build-n-cache-assimp-windows:
   runs-on: windows-latest
   steps:
    - name: Cache Assimp
      id: cache-assimp-windows
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-windows
      with:
        # It is caching the folder that also contains source and building files, maybe in the future it would be nice cache only the includes and dll
        path: |
               C:/PROGRA~2/Assimp
        key: ${{ runner.os }}-build-${{ env.cache-name }}
        
    - if: steps.cache-assimp-windows.outputs.cache-hit != 'true'
      name: Set up MinGW
      uses: e-t-l/setup-mingw@patch-1 #egor-tensin/setup-mingw@v2
      with:
          platform: x64            
    
    - if: steps.cache-assimp-windows.outputs.cache-hit != 'true'
      name: Check out Assimp repo
      uses: actions/checkout@master
      with:
          repository: assimp/assimp
          ref: v${{ env.ASSIMP_VERSION }}
          path: ${{github.workspace}}/assimp
      
    - if: steps.cache-assimp-windows.outputs.cache-hit != 'true'
      name: Build Assimp repo
      env:
         CMAKE_GENERATOR: "MinGW Makefiles"
      run: |
            cd ${{github.workspace}}/assimp
            cmake -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_GENERATOR="MinGW Makefiles" -DASSIMP_WARNINGS_AS_ERRORS=OFF
            mingw32-make install -j8
            xcopy  /I  "C:/PROGRA~2/Assimp"  "${{github.workspace}}/assimp-build"
      shell: cmd
            
 build-n-cache-ogre-windows:
    needs: build-n-cache-assimp-windows
    runs-on: windows-latest
    steps:
    - name: Cache Assimp
      id: cache-assimp-windows
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-windows
      with:
        path: |
               C:/PROGRA~2/Assimp
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - name: Cache Ogre
      id: cache-ogre-windows
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-windows
      with:
        path: ${{github.workspace}}/ogre-build/SDK
        # Need to delete manually if needed to rebuild. Until I find a better solution for detecting changes in the ogre repo.
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - if: steps.cache-ogre-windows.outputs.cache-hit != 'true'
      name: Install Doxygen
      shell: cmd
      run: |
        curl -L -o doxygen-installer.exe "https://www.doxygen.nl/files/doxygen-1.9.7-setup.exe"
        doxygen-installer.exe /VERYSILENT
            
    - if: steps.cache-ogre-windows.outputs.cache-hit != 'true'
      name: Check out ogre repo
      uses: actions/checkout@master
      with:
          repository: OGRECave/ogre
          ref: v${{ env.OGRE_VERSION }}
          path: ${{github.workspace}}/ogre

    - if: steps.cache-ogre-windows.outputs.cache-hit != 'true'
      name: Install Qt (for MinGW)
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: ${{ env.AQT_VERSION }}
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_cmake tools_mingw1310'
        
    - if: steps.cache-ogre-windows.outputs.cache-hit != 'true'
      name: Add Qt MinGW to PATH for Ogre build
      run: |
        echo "D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "Added Qt MinGW 13.1.0 to PATH for Ogre build"
        where gcc.exe
        gcc --version
      shell: powershell
           
    - if: steps.cache-ogre-windows.outputs.cache-hit != 'true'
      name: Build Ogre3D
      shell: powershell
      env:
        CMAKE_GENERATOR: "MinGW Makefiles"
        ASSIMP_DIR: "C:/Program Files (x86)/Assimp/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }}/"
        PATH: "D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin;D:/a/QtMeshEditor/Qt/Tools/CMake_64/bin;${{ env.PATH }}"
      run: |
        Write-Host "Verifying Ogre build tools:"
        Write-Host "gcc location: $((Get-Command gcc.exe).Source)"
        Write-Host "g++ location: $((Get-Command g++.exe).Source)"
        Write-Host "mingw32-make location: $((Get-Command mingw32-make.exe).Source)"
        Write-Host "cmake location: $((Get-Command cmake.exe).Source)"
        Set-Location "${{github.workspace}}/ogre"
        cmake -B "${{github.workspace}}/ogre-build" -S . -DDOXYGEN_EXECUTABLE="C:\Program Files\doxygen\bin\doxygen.exe" -DCMAKE_C_COMPILER="D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin/gcc.exe" -DCMAKE_CXX_COMPILER="D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin/g++.exe" -DCMAKE_CXX_STANDARD=17 -DOGRE_BUILD_PLUGIN_ASSIMP=ON -DOGRE_BUILD_PLUGIN_PCZ=ON -DOGRE_BUILD_PLUGIN_DOT_SCENE=ON -DOGRE_BUILD_RENDERSYSTEM_GL=ON -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON -DOGRE_BUILD_RENDERSYSTEM_GLES2=OFF -DOGRE_BUILD_RENDERSYSTEM_D3D9=OFF -DOGRE_BUILD_RENDERSYSTEM_D3D11=OFF -DOGRE_BUILD_TESTS=OFF -DOGRE_BUILD_TOOLS=OFF -DOGRE_BUILD_SAMPLES=OFF -DOGRE_BUILD_COMPONENT_CSHARP=OFF -DOGRE_BUILD_COMPONENT_JAVA=OFF -DOGRE_BUILD_COMPONENT_PYTHON=OFF -DOGRE_INSTALL_TOOLS=OFF -DOGRE_INSTALL_DOCS=OFF -DOGRE_INSTALL_SAMPLES=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        Set-Location "${{github.workspace}}/ogre-build"
        D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin/mingw32-make.exe install -j8
        
 build-windows:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    needs: [build-n-cache-assimp-windows, build-n-cache-ogre-windows]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
      with:
         submodules: true

    - name: Cache Assimp
      id: cache-assimp-windows
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-windows
      with:
        # It is caching the folder that also contains source and building files, maybe in the future it would be nice cache only the includes and dll
        path: |
               C:/PROGRA~2/Assimp
        key: ${{ runner.os }}-build-${{ env.cache-name }}
    
    - name: Cache Ogre
      id: cache-ogre-windows
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-windows
      with:
        path: ${{github.workspace}}/ogre-build/SDK
        # Need to delete manually if needed to rebuild. Until I find a better solution for detecting changes in the ogre repo.
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: ${{ env.AQT_VERSION }}
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_cmake tools_mingw1310'
        
    - name: Add Qt MinGW to PATH
      run: |
        echo "D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "Added Qt MinGW 13.1.0 to PATH"
        where gcc.exe
        gcc --version
      shell: powershell
     
    - name: Configure CMake
      env:
         OGRE_DIR: ${{github.workspace}}/ogre-build/SDK/CMake/
         CMAKE_GENERATOR: "MinGW Makefiles"
         ASSIMP_DIR: C:/PROGRA~2/Assimp
         PATH: "D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin;D:/a/QtMeshEditor/Qt/Tools/CMake_64/bin;${{ env.PATH }}"
      run: |
        Write-Host "Verifying compiler paths:"
        Write-Host "gcc location: $((Get-Command gcc.exe).Source)"
        Write-Host "g++ location: $((Get-Command g++.exe).Source)"  
        Write-Host "mingw32-make location: $((Get-Command mingw32-make.exe).Source)"
        Write-Host "cmake location: $((Get-Command cmake.exe).Source)"
        gcc --version
        cmake --version
        cmake -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DQT_QMAKE_EXECUTABLE=qmake -DCMAKE_C_COMPILER="D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin/gcc.exe" -DCMAKE_CXX_COMPILER="D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin/g++.exe" -DCMAKE_EXE_LINKER_FLAGS=-static -DQt6_DIR=D:/a/QtMeshEditor/Qt/${{env.QT_VERSION}}/mingw_64/lib/cmake/Qt6 -DQT_DIR=D:/a/QtMeshEditor/Qt/${{env.QT_VERSION}}/mingw_64/lib/cmake/Qt6 -DQt6GuiTools_DIR=D:/a/QtMeshEditor/Qt/${{env.QT_VERSION}}/mingw_64/lib/cmake/Qt6GuiTools -DOGRE_DIR=${{github.workspace}}/ogre-build/SDK/CMake/ -DASSIMP_DIR=C:/PROGRA~2/Assimp/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }}
      shell: powershell

    - name: Build
      env:
        PATH: "D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin;D:/a/QtMeshEditor/Qt/Tools/CMake_64/bin;${{ env.PATH }}"
      run: |
        Write-Host "Using make from:"
        Write-Host "mingw32-make location: $((Get-Command mingw32-make.exe).Source)"
        mingw32-make --version
        D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin/mingw32-make.exe install -j8
      shell: powershell

    - name: Copy assimp dll to the binary folder
      run: |
            Write-Host "Checking available DLL files:"
            Get-ChildItem C:/PROGRA~2/Assimp/bin
            if (Test-Path "C:/PROGRA~2/Assimp/bin/libassimp-6.dll") {
                Copy-Item "C:/PROGRA~2/Assimp/bin/libassimp-6.dll" "${{github.workspace}}/bin"
            } elseif (Test-Path "C:/PROGRA~2/Assimp/bin/libassimp.dll") {
                Copy-Item "C:/PROGRA~2/Assimp/bin/libassimp.dll" "${{github.workspace}}/bin"
            } else {
                Write-Host "Looking for any assimp dll files:"
                Copy-Item "C:/PROGRA~2/Assimp/bin/libassimp*.dll" "${{github.workspace}}/bin"
            }
      shell: powershell

    - name: Copy gcc dll to the binary folder
      run: |
            Write-Host "Using Qt MinGW 13.1.0 DLLs"
            $mingwBin = "D:/a/QtMeshEditor/Qt/Tools/mingw1310_64/bin"
            Write-Host "MinGW bin directory: $mingwBin"
            Get-ChildItem "$mingwBin/*.dll" | Where-Object { $_.Name -match "(libgcc|libstdc|libwinpthread)" }
            Copy-Item "$mingwBin/libgcc_s_seh-1.dll" "${{github.workspace}}/bin" -ErrorAction SilentlyContinue
            Copy-Item "$mingwBin/libstdc++-6.dll" "${{github.workspace}}/bin" -ErrorAction SilentlyContinue
            Copy-Item "$mingwBin/libwinpthread-1.dll" "${{github.workspace}}/bin" -ErrorAction SilentlyContinue
            Copy-Item "${{github.workspace}}/src/dependencies/zlib1.dll" "${{github.workspace}}/bin/zlib1__.dll" -ErrorAction SilentlyContinue
            Copy-Item "${{github.workspace}}/src/dependencies/zlib1.dll" "${{github.workspace}}/bin/libzlib.dll" -ErrorAction SilentlyContinue
      shell: powershell

    - name: Upload Artifact
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: actions/upload-artifact@v4
      with:
        name: QtMeshEditor-${{github.ref_name}}-bin-Windows
        path: ${{github.workspace}}/bin
    
    - name: Compress File
      if: github.event_name == 'release' && github.event.action == 'published'
      run: Compress-Archive ${{github.workspace}}/bin QtMeshEditor-${{github.ref_name}}-bin-Windows.zip
      shell: powershell
      
    - name: Uploadfile to release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: xresloader/upload-to-github-release@main
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          file: QtMeshEditor-${{github.ref_name}}-bin-Windows.zip
          update_latest_release: true
          overwrite: false
          verbose: true

####################################################################
# Linux Deploy
####################################################################

 build-n-cache-assimp-linux:
    runs-on: ubuntu-latest
    steps:
    - name: change folder permissions
      run: |
            sudo chmod 777 /usr/local/lib
            sudo chmod 777 /usr/local/include
      
    - name: Cache Assimp
      id: cache-assimp-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-linux
      with:
        # Assimp cache files are stored in `/home/runner/work/QtMeshEditor/QtMeshEditor/assimp` on Linux
        path: |
               /usr/local/lib/cmake/
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        #key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('/home/runner/work/QtMeshEditor/QtMeshEditor/assimp') }}
        # Need to delete manually if needed to rebuild. Until I find a better solution for detecting changes in the assimp repo.
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - if: steps.cache-assimp-linux.outputs.cache-hit != 'true'
      name: Check out Assimp repo
      uses: actions/checkout@master
      with:
          repository: assimp/assimp
          ref: v${{ env.ASSIMP_VERSION }}
          path: /home/runner/work/QtMeshEditor/QtMeshEditor/assimp
            
    - if: steps.cache-assimp-linux.outputs.cache-hit != 'true'
      name: Build Assimp repo
      run: |
            cmake -B /home/runner/work/QtMeshEditor/QtMeshEditor/assimp-build -S /home/runner/work/QtMeshEditor/QtMeshEditor/assimp -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
            cd /home/runner/work/QtMeshEditor/QtMeshEditor/assimp-build/
            sudo make install -j8

 build-n-cache-ogre-linux:
    needs: build-n-cache-assimp-linux
    runs-on: ubuntu-latest
    steps:        
    - name: change folder permissions
      run: |
            sudo chmod 777 /usr/local/lib
            sudo chmod 777 /usr/local/include
            sudo chmod 777 /usr/local/share
      
    - name: Cache Ogre
      id: cache-ogre-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-linux
      with:
        path: |
               /usr/local/lib/lib*
               /usr/local/share/OGRE/
               /usr/local/share/OGRE*
               /usr/local/include/OGRE/
               /usr/local/lib/OGRE/
               /usr/local/lib/pkgconfig/
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - if: steps.cache-ogre-linux.outputs.cache-hit != 'true'
      name: Cache Assimp
      id: cache-assimp-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-linux
      with:
        # Assimp cache files are stored in `/home/runner/work/QtMeshEditor/assimp` on Linux/macOS
        path: |
               /usr/local/lib/cmake/
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        #key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('/home/runner/work/QtMeshEditor/QtMeshEditor/assimp') }}
        # Need to delete manually if needed to rebuild. Until I find a better solution for detecting changes in the assimp repo.
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - if: steps.cache-ogre-linux.outputs.cache-hit != 'true'
      name: install openGL
      run: |
            sudo apt update
            sudo apt-get install freeglut3-dev libxrandr-dev
            
    - if: steps.cache-ogre-linux.outputs.cache-hit != 'true'
      name: Check out ogre repo
      uses: actions/checkout@master
      with:
          repository: OGRECave/ogre
          ref: v${{ env.OGRE_VERSION }}
          path: /home/runner/work/QtMeshEditor/QtMeshEditor/ogre
         
    - if: steps.cache-ogre-linux.outputs.cache-hit != 'true'
      name: Build Ogre3D repo
      run: |
            sudo cmake -B /home/runner/work/QtMeshEditor/QtMeshEditor/ogre-build \
            -S /home/runner/work/QtMeshEditor/QtMeshEditor/ogre \
            -DOGRE_BUILD_PLUGIN_ASSIMP=ON -Dassimp_DIR=/usr/local/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }} \
            -DOGRE_BUILD_PLUGIN_DOT_SCENE=ON -DOGRE_BUILD_RENDERSYSTEM_GL=ON \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON -DOGRE_BUILD_RENDERSYSTEM_GLES2=OFF \
            -DOGRE_BUILD_TESTS=OFF -DOGRE_BUILD_TOOLS=OFF -DOGRE_BUILD_SAMPLES=OFF \
            -DOGRE_BUILD_COMPONENT_CSHARP=OFF -DOGRE_BUILD_COMPONENT_JAVA=OFF \
            -DOGRE_BUILD_COMPONENT_BULLET=OFF \
            -DOGRE_BUILD_COMPONENT_PYTHON=OFF -DOGRE_INSTALL_TOOLS=OFF \
            -DOGRE_INSTALL_DOCS=OFF -DOGRE_INSTALL_SAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
            cd /home/runner/work/QtMeshEditor/QtMeshEditor/ogre-build/
            sudo make install -j8
      
 build-linux:
    needs: [build-n-cache-assimp-linux, build-n-cache-ogre-linux]
    runs-on: ubuntu-latest
    env: 
      LD_LIBRARY_PATH: /usr/local/lib/:/usr/local/lib/OGRE/:/usr/local/lib/pkgconfig/
    steps:
    - uses: actions/checkout@v3.5.3
      with:
         submodules: true
           
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: ${{ env.AQT_VERSION }}
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'

    - name: change folder permissions
      run: |
          sudo chmod 777 /usr/local/lib
          sudo chmod 777 /usr/local/include
          sudo chmod 777 /usr/local/share
        
    - name: Cache Assimp
      id: cache-assimp-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-linux
      with:
        path: |
               /usr/local/lib/cmake/
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        key: ${{ runner.os }}-build-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
    
    - name: Cache Ogre
      id: cache-ogre-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-linux
      with:
        path: |
               /usr/local/lib/lib*
               /usr/local/share/OGRE/
               /usr/local/share/OGRE*
               /usr/local/include/OGRE/
               /usr/local/lib/OGRE/
               /usr/local/lib/pkgconfig/
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - name: Configure CMake
      run: |
            sudo cmake -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DASSIMP_DIR=/usr/local/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }} \
            -DASSIMP_INCLUDE_DIR=/usr/local/include/assimp \
            -DQt6_DIR=/home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6 \
            -DQT_DIR=/home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6 \
            -DQt6GuiTools_DIR=/home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6GuiTools 

    - name: Build
      run: sudo make install -j8

    - name: Add missing libraries
      run: |
            # Create the bin directory since cmake builds to build/bin but we need ./bin for the tests
            mkdir -p ./bin
            mkdir -p ./build/bin
            
            # Copy Qt ICU libraries to both locations
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicui18n.* ./bin
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicuuc.* ./bin
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicudata.* ./bin
            
            # Also copy to build/bin where cmake actually puts the executables
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicui18n.* ./build/bin/ || true
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicuuc.* ./build/bin/ || true
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicudata.* ./build/bin/ || true
            
            # Copy libraries to system locations
            sudo cp -R ./bin/*.so* /lib/x86_64-linux-gnu || true
            sudo cp -R /usr/local/lib/OGRE/* /lib/x86_64-linux-gnu || true
            sudo cp -R /usr/local/lib/OGRE/* ./bin || true
            sudo cp -R /usr/local/lib/OGRE/* ./build/bin/ || true
  
    - name: Manual Pack
      run: |
            echo "Creating folders 'n files"
            mkdir -p ./pack-deb/usr/local/bin
            mkdir -p ./pack-deb/usr/share/qtmesheditor/
            mkdir ./pack-deb/usr/share/qtmesheditor/cfg/
            mkdir ./pack-deb/usr/share/qtmesheditor/media/
            mkdir ./pack-deb/usr/share/qtmesheditor/platforms/
            mkdir -p ./pack-deb/lib/x86_64-linux-gnu/
            mkdir ./pack-deb/DEBIAN/
            cp ./bin/DEBIAN-control ./pack-deb/DEBIAN/control
            cp ./bin/QtMeshEditor ./pack-deb/usr/share/qtmesheditor/qtmesheditor
            touch ./pack-deb/usr/local/bin/qtmesheditor
            echo "/usr/share/qtmesheditor/qtmesheditor" >> ./pack-deb/usr/local/bin/qtmesheditor
            sudo chmod 755 ./pack-deb/usr/local/bin/qtmesheditor
            cp -R ./bin/cfg/ ./pack-deb/usr/share/qtmesheditor/
            sudo chmod -R 755 ./pack-deb/usr/share/qtmesheditor/cfg
            cp -R ./bin/media/ ./pack-deb/usr/share/qtmesheditor/
            cp -R ./bin/platforms/ ./pack-deb/usr/share/qtmesheditor/
            cp -R ./bin/*.so* ./pack-deb/lib/x86_64-linux-gnu/
            dpkg-deb --build --root-owner-group pack-deb 
            mv pack-deb.deb qtmesheditor_amd64.deb
    
    - uses: actions/upload-artifact@v4
      if: github.event_name == 'release' && github.event.action == 'published'
      with:
        name: linux-binaries
        path: ${{github.workspace}}/*.deb

    - if: github.event_name == 'release' && github.event.action == 'published'
      uses: xresloader/upload-to-github-release@main
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          file: ${{github.workspace}}/*.deb
          update_latest_release: true
          overwrite: false
          verbose: true

####################################################################
# Unit Tests - on Linux 
####################################################################
      
 unit-tests-linux:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    needs: [build-n-cache-assimp-linux, build-n-cache-ogre-linux]
    runs-on: ubuntu-latest
    permissions: read-all
    env: 
          LD_LIBRARY_PATH: gcc_64/lib/:/usr/local/lib/:/usr/local/lib/OGRE/:/usr/local/lib/pkgconfig/:/lib/x86_64-linux-gnu/
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: 0
          DISPLAY: :99
    steps:
    - uses: actions/checkout@v3.5.3
      with:
         submodules: true
         fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
           
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: ${{ env.AQT_VERSION }}
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'

    - name: change folder permissions
      run: |
            sudo chmod 777 /usr/local/lib
            sudo chmod 777 /usr/local/include
            sudo chmod 777 /usr/local/share
        
    - name: Cache Assimp
      id: cache-assimp-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-linux
      with:
        path: |
               /usr/local/lib/cmake/
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        key: ${{ runner.os }}-build-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
 
    - name: Cache Ogre
      id: cache-ogre-linux
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-linux
      with:
        path: |
               /usr/local/lib/lib*
               /usr/local/share/OGRE/
               /usr/local/share/OGRE*
               /usr/local/include/OGRE/
               /usr/local/lib/OGRE/
               /usr/local/lib/pkgconfig/
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - name: Install Build Wrapper
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v4
      env:
        SONAR_HOST_URL: https://sonarcloud.io

    - name: Install sonar-scanner
      run: |
        npm install -g sonar-scanner

    - name: Configure CMake for Tests
      run: |
            mkdir build
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DASSIMP_DIR=/usr/local/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }} \
            -DASSIMP_INCLUDE_DIR=/usr/local/include/assimp \
            -DQt6_DIR=/home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6 \
            -DQT_DIR=/home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6 \
            -DQt6GuiTools_DIR=/home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt6GuiTools \
            -DBUILD_TESTS=ON -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -O0" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DBUILD_QT_MESH_EDITOR=OFF
      
    - name: Run build-wrapper
      run: |
          echo "=== Running build-wrapper for SonarCloud analysis ==="

          # Clean any previous build artifacts to ensure fresh compilation
          make -C build clean 2>/dev/null || echo "No previous build to clean"

          # Run build-wrapper to capture compilation into a named directory
          build-wrapper-linux-x86-64 --out-dir build-wrapper-output make -C build -j$(nproc)

          echo "=== Build wrapper completed ==="
          ls -la build-wrapper-output/ || echo "Build wrapper output directory not created"
          ls -la build-wrapper-output/build-wrapper-dump.json 2>/dev/null || echo "build-wrapper-dump.json not found"

    - name: Add missing libraries
      run: |
            # Create the bin directory since cmake builds to build/bin but we need ./bin for the tests
            mkdir -p ./bin
            mkdir -p ./build/bin
            
            # Copy Qt ICU libraries to both locations
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicui18n.* ./bin
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicuuc.* ./bin
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicudata.* ./bin
            
            # Also copy to build/bin where cmake actually puts the executables
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicui18n.* ./build/bin/ || true
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicuuc.* ./build/bin/ || true
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/libicudata.* ./build/bin/ || true
            
            # Copy libraries to system locations
            sudo cp -R ./bin/*.so* /lib/x86_64-linux-gnu || true
            sudo cp -R /usr/local/lib/OGRE/* /lib/x86_64-linux-gnu || true
            sudo cp -R /usr/local/lib/OGRE/* ./bin || true
            sudo cp -R /usr/local/lib/OGRE/* ./build/bin/ || true
    
    - name: Setup headless environment for Qt tests
      run: |
            sudo apt-get update
            sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libx11-dev xvfb
            # Start Xvfb for tests that might need a display
            Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
            sleep 3
            echo "DISPLAY=:99" >> $GITHUB_ENV
            echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

    - name: Run Comprehensive Test Suite
      env:
         QT_QPA_PLATFORM: offscreen
         QT_DEBUG_PLUGINS: 0
         DISPLAY: :99
      run: |
            export QT_QPA_PLATFORM="offscreen"
            export QT_DEBUG_PLUGINS=0
            sudo cp -R /home/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/gcc_64/lib/ /lib/x86_64-linux-gnu/
            export DISPLAY=:99
            
            # Function to find and run test executable
            run_test() {
                local test_name=$1
                local output_file=$2
                
                if [ -f "./build/bin/$test_name" ]; then
                    echo "Found $test_name in ./build/bin/"
                    sudo -E ./build/bin/$test_name --gtest_output=xml:$output_file
                elif [ -f "./bin/$test_name" ]; then
                    echo "Found $test_name in ./bin/"
                    sudo -E ./bin/$test_name --gtest_output=xml:$output_file
                else
                    echo "$test_name not found in ./build/bin/ or ./bin/"
                    return 1
                fi
            }
            
            echo "Running UnitTests (Google Tests - includes Assimp and other unit tests)..."
            run_test "UnitTests" "test-results-unittests.xml" || echo "UnitTests not found"
            
            echo "Running MaterialEditorQML Unit Tests..."
            run_test "MaterialEditorQML_test" "test-results-materialeditor.xml" || echo "MaterialEditorQML_test not found"
            
            echo "Running MaterialEditorQML QML Integration Tests..."
            run_test "MaterialEditorQML_qml_test" "test-results-qml.xml" || echo "MaterialEditorQML_qml_test not found"
            
            echo "Running MaterialEditorQML Performance Tests..."
            run_test "MaterialEditorQML_perf_test" "test-results-perf.xml" || echo "MaterialEditorQML_perf_test not found"
            
            echo "Running QML Component Tests..."
            run_test "MaterialEditorQML_qml_test_runner" "test-results-qml-component.xml" || echo "MaterialEditorQML_qml_test_runner not found"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results-*.xml
          
    - name: Set up Python 3.8 for gcovr
      uses: actions/setup-python@v4
      with:
        python-version: 3.8
        
    - name: install gcovr
      run: |
        pip install gcovr==7.2

    - name: Generate coverage data
      run: |
        echo "=== Coverage Generation Debug Info ==="
        echo "Current directory: $(pwd)"

        GCDA_COUNT=$(find build -name "*.gcda" -type f 2>/dev/null | wc -l)
        echo "Found $GCDA_COUNT .gcda files"

        if [ "$GCDA_COUNT" -eq 0 ]; then
            echo "ERROR: No .gcda files found! Tests may not have run with coverage."
            exit 1
        fi

        echo "=== Generating SonarQube coverage XML via gcovr ==="
        gcovr --root . \
              --filter 'src/' \
              --exclude 'src/OgreXML/' \
              --exclude 'src/dependencies/' \
              --exclude '.*_test\.cpp' \
              --exclude '.*TestHelpers\.h' \
              --exclude '.*QtAppEnvironment_test\.cpp' \
              --exclude '.*_autogen' \
              --exclude '.*/ui_files/' \
              --exclude '.*/moc_' \
              --sonarqube=coverage.xml \
              --gcov-executable gcov \
              --verbose \
              build \
              2>&1 | tail -40

        echo "=== Validating coverage files ==="
        if [ -f coverage.xml ] && [ -s coverage.xml ]; then
            echo "coverage.xml exists and has content ($(wc -l < coverage.xml) lines)"
            head -5 coverage.xml
            echo "..."
            echo "Files with coverage data:"
            grep -c '<file' coverage.xml || echo "0 files"
        else
            echo "ERROR: coverage.xml is missing or empty!"
            exit 1
        fi

    - name: Run sonar-scanner
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
          echo "=== SonarCloud Analysis Setup ==="

          # Ensure compile_commands.json is available for C++ analysis
          if [ -f build/compile_commands.json ]; then
            cp build/compile_commands.json .
            echo "Copied compile_commands.json from build/"
          fi

          # Check build-wrapper output
          BW_DIR="build-wrapper-output"
          if [ -d "$BW_DIR" ]; then
            echo "Build-wrapper output found at: $BW_DIR"
            ls -la "$BW_DIR"/ | head -5
          else
            echo "WARNING: Build-wrapper output not found at $BW_DIR"
            find . -name "build-wrapper-dump.json" -type f 2>/dev/null | head -5
          fi

          # Check coverage files
          echo "=== Coverage files ==="
          ls -la coverage.xml 2>/dev/null || echo "coverage.xml not found"

          GCOV_COUNT=$(find build -name "*.gcov" -type f 2>/dev/null | wc -l)
          echo "Found $GCOV_COUNT .gcov files in build directory"

          echo "=== Running SonarCloud analysis ==="
          sonar-scanner \
            -Dsonar.projectKey=fernandotonon_QtMeshEditor \
            -Dsonar.organization=fernandotonon \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sources=src/ \
            -Dsonar.tests=src/,tests/ \
            -Dsonar.test.inclusions=**/*_test.cpp,**/test_*.cpp,tests/**/*.cpp \
            -Dsonar.exclusions=**/OgreXML/**,**/dependencies/**,**/*_autogen/**,**/CMakeFiles/**,**/ui_files/**,**/moc_*,**/_deps/** \
            -Dsonar.coverage.exclusions=**/*_test.cpp,**/test_*.cpp,tests/**/*.cpp,tests/**/*.qml,**/*_autogen/**,**/TestHelpers.h \
            -Dsonar.coverageReportPaths=coverage.xml \
            -Dsonar.c.file.suffixes=.c \
            -Dsonar.cpp.file.suffixes=.cpp,.cc,.cxx,.c++,.hpp,.hh,.hxx,.h++,.h \
            -Dsonar.objc.file.suffixes=.m,.mm \
            -Dsonar.cfamily.build-wrapper-output=$BW_DIR \
            -Dsonar.cfamily.cache.enabled=true \
            -Dsonar.cfamily.threads=4 \
            -Dsonar.verbose=true

            
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
            
####################################################################
# MacOS Deploy 
####################################################################

 build-n-cache-assimp-macos:
    runs-on: macos-latest
    steps:
    - name: change folder permissions
      run: |
            sudo mkdir /usr/local/lib
            sudo mkdir /usr/local/include
            sudo chmod 777 /usr/local/lib
            sudo chmod 777 /usr/local/include

    - name: Cache Assimp
      id: cache-assimp-macos
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-macos
      with:
        path: |
               /usr/local/lib/cmake
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        #key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('/home/runner/work/QtMeshEditor/QtMeshEditor/assimp') }}
        # Need to delete manually if needed to rebuild. Until I find a better solution for detecting changes in the assimp repo.
        key: ${{ runner.os }}-build-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          
    - if: steps.cache-assimp-macos.outputs.cache-hit != 'true'
      name: Check out Assimp repo
      uses: actions/checkout@master
      with:
          repository: assimp/assimp
          ref: v${{ env.ASSIMP_VERSION }}
          path: /Users/runner/work/QtMeshEditor/QtMeshEditor/assimp
      
    - if: steps.cache-assimp-macos.outputs.cache-hit != 'true'
      name: Build Assimp repo
      run: |
            cmake -B /Users/runner/work/QtMeshEditor/QtMeshEditor/assimp-build -S /Users/runner/work/QtMeshEditor/QtMeshEditor/assimp -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
            cd /Users/runner/work/QtMeshEditor/QtMeshEditor/assimp-build/
            sudo make install -j8

 build-n-cache-ogre-macos:
    needs: build-n-cache-assimp-macos
    runs-on: macos-latest
    steps:    
    - name: change folder permissions
      run: |
          sudo mkdir /usr/local/lib
          sudo mkdir /usr/local/include
          sudo chmod 777 /usr/local/lib
          sudo chmod 777 /usr/local/include

    - name: Cache Assimp
      id: cache-assimp-macos
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-macos
      with:
        path: |
               /usr/local/lib/cmake
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        key: ${{ runner.os }}-build-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
      
    - name: Cache Ogre
      id: cache-ogre-macos
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-macos
      with:
        path: ${{github.workspace}}/ogre/SDK
        key: ${{ runner.os }}-build-${{ env.cache-name }}
    
    - if: steps.cache-ogre-macos.outputs.cache-hit != 'true'
      name: Check out ogre repo
      uses: actions/checkout@master
      with:
          repository: OGRECave/ogre
          ref: v${{ env.OGRE_VERSION }}
          path: ${{github.workspace}}/ogre
         
    - if: steps.cache-ogre-macos.outputs.cache-hit != 'true'
      name: Build Ogre3D repo
      run: |
            cd ${{github.workspace}}/ogre/
            sudo cmake -S . -DOGRE_BUILD_PLUGIN_ASSIMP=ON -Dassimp_DIR=/usr/local/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }}/ \
            -DOGRE_BUILD_PLUGIN_DOT_SCENE=ON -DOGRE_BUILD_RENDERSYSTEM_GL=ON -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=ON \
            -DOGRE_BUILD_RENDERSYSTEM_GLES2=OFF -DOGRE_BUILD_TESTS=OFF -DOGRE_BUILD_TOOLS=OFF -DOGRE_BUILD_SAMPLES=OFF \
            -DOGRE_BUILD_COMPONENT_CSHARP=OFF -DOGRE_BUILD_COMPONENT_JAVA=OFF -DOGRE_BUILD_COMPONENT_PYTHON=OFF \
            -DOGRE_INSTALL_TOOLS=OFF -DOGRE_INSTALL_DOCS=OFF -DOGRE_INSTALL_SAMPLES=OFF -DOGRE_BUILD_LIBS_AS_FRAMEWORKS=OFF \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
            sudo make install -j8

 build-macos:
    needs: [build-n-cache-assimp-macos, build-n-cache-ogre-macos]
    runs-on: macos-latest
    steps:
    - name: change folder permissions
      run: |
            sudo mkdir -p /usr/local/lib
            sudo mkdir -p /usr/local/include
            sudo chmod -R 777 /usr/local/lib
            sudo chmod -R 777 /usr/local/include

    - uses: actions/checkout@v3
      with:
         submodules: true
         
    - run: |
            cd ${{github.workspace}}/src/dependencies/ogre-procedural
            git checkout master
            git pull
            
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: ${{ env.AQT_VERSION }}
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        tools: 'tools_cmake'

    - name: Debug Qt Installation
      run: |
        echo "=== Qt Installation Debug ==="
        echo "Qt installation directory:"
        ls -la /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/
        echo "Looking for lib directories:"
        find /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/ -name "lib" -type d
        echo "Looking for QtWidgets.framework:"
        find /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/ -name "QtWidgets.framework" -type d
        echo "Architecture of current runner:"
        uname -m
        echo "Available Qt architectures:"
        file /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/*/bin/qmake 2>/dev/null || echo "qmake not found"

    - name: Cache Assimp
      id: cache-assimp-macos
      uses: actions/cache@v3
      env:
        cache-name: cache-assimp-macos
      with:
        path: |
               /usr/local/lib/cmake
               /usr/local/include/assimp
               /usr/local/include/contrib
               /usr/local/lib/pkgconfig/assimp.pc
               /usr/local/lib/libassimp*
               /usr/local/lib/libzlibstatic.a
        key: ${{ runner.os }}-build-${{ env.cache-name }}
      
    - name: Cache Ogre
      id: cache-ogre-macos
      uses: actions/cache@v3
      env:
        cache-name: cache-ogre-macos
      with:
        path: ${{github.workspace}}/ogre/SDK
        key: ${{ runner.os }}-build-${{ env.cache-name }}
    
    - name: Configure CMake
      env:
         OGRE_DIR: ${{github.workspace}}/ogre/SDK/CMake/
      run: |
            # Detect the actual Qt path structure
            if [ -d "/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/macos" ]; then
                QT_ARCH_DIR="macos"
            elif [ -d "/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/clang_64" ]; then
                QT_ARCH_DIR="clang_64"
            else
                echo "ERROR: Could not find Qt installation directory"
                ls -la /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/
                exit 1
            fi
            
            echo "Using Qt architecture directory: $QT_ARCH_DIR"
            
            # Configure with dynamic architecture detection and proper universal binary support
            sudo cmake -S . \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DASSIMP_DIR=/usr/local/lib/cmake/assimp-${{ env.ASSIMP_DIR_VERSION }} \
            -DASSIMP_INCLUDE_DIR=/usr/local/include/assimp \
            -DQt6_DIR=/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/cmake/Qt6 \
            -DQT_DIR=/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/cmake/Qt6 \
            -DQt6GuiTools_DIR=/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/cmake/Qt6GuiTools \
            -DOGRE_DIR=${{github.workspace}}/ogre/SDK/CMake/ 
    
    - name: Build
      # Build your program with the given configuration
      run: |
            sudo make install -j8

    - name: Copy Qt libs to app folder
      run: |
            # Detect the actual Qt path structure
            if [ -d "/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/macos" ]; then
                QT_ARCH_DIR="macos"
            elif [ -d "/Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/clang_64" ]; then
                QT_ARCH_DIR="clang_64"
            else
                echo "ERROR: Could not find Qt installation directory"
                exit 1
            fi
            
            echo "Copying Qt frameworks from: /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/"
            
            # Create proper macOS app bundle structure
            sudo mkdir -p ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks
            sudo mkdir -p ${{github.workspace}}/bin/QtMeshEditor.app/Contents/PlugIns/platforms
            
            # Copy Qt frameworks to proper Frameworks directory
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtWidgets.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtCore.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtGui.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtDBus.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQuickWidgets.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQuick.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQml.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQmlModels.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQmlMeta.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtNetwork.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtOpenGL.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQuickControls2.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "QtQuickControls2 not found, continuing..."
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQuickDialogs2.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "QtQuickDialogs2 not found, continuing..."
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQuickTemplates2.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "QtQuickTemplates2 not found, continuing..."
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtLabsPlatform.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "QtLabsPlatform not found, continuing..."
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQmlCore.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "QtQmlCore not found, continuing..."
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/lib/QtQmlWorkerScript.framework ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "QtQmlWorkerScript not found, continuing..."
            
            # Copy plugins to proper PlugIns directory
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/plugins/platforms/* ${{github.workspace}}/bin/QtMeshEditor.app/Contents/PlugIns/platforms/

            # Copy QML plugins for QtQuick components
            sudo mkdir -p ${{github.workspace}}/bin/QtMeshEditor.app/Contents/PlugIns/qml
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/qml/QtQuick ${{github.workspace}}/bin/QtMeshEditor.app/Contents/PlugIns/qml/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/qml/QtQml ${{github.workspace}}/bin/QtMeshEditor.app/Contents/PlugIns/qml/
            sudo cp -R /Users/runner/work/QtMeshEditor/Qt/${{ env.QT_VERSION }}/$QT_ARCH_DIR/qml/Qt ${{github.workspace}}/bin/QtMeshEditor.app/Contents/PlugIns/qml/ || echo "Qt labs plugins not found, continuing..."

            # Copy Assimp libraries to MacOS directory
            sudo cp -R /usr/local/lib/libassimp* ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/ || echo "Assimp libraries not found, continuing..."

    - name: Prepare for packing
      run: |
            sudo cp -R ${{github.workspace}}/bin/media ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/media
            sudo cp -R ${{github.workspace}}/bin/cfg ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/cfg
            sudo cp -R ${{github.workspace}}/resources/icon.icns ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/media
            sudo mkdir -p ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Resources

            # Create qt.conf to help Qt find plugins in the bundle
            echo -e "[Paths]\nPlugins = PlugIns\nQml2Imports = PlugIns/qml" | sudo tee ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Resources/qt.conf
            sudo cp -R ${{github.workspace}}/resources/icon.icns ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Resources
            sudo cp -R ${{github.workspace}}/bin/Info.plist ${{github.workspace}}/bin/QtMeshEditor.app/Contents/
            
            # Fix library paths for proper app bundle structure
            sudo install_name_tool -add_rpath @executable_path/../Frameworks ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/QtMeshEditor
            sudo install_name_tool -add_rpath @loader_path/ ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/QtMeshEditor

            # Fix all dylibs in MacOS directory to use @rpath for their dependencies
            echo "Fixing dylib install names and rpaths..."
            for dylib in ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/*.dylib; do
                if [ -f "$dylib" ]; then
                    dylib_name=$(basename "$dylib")
                    echo "Processing $dylib_name"

                    # Change the install name to use @rpath
                    sudo install_name_tool -id "@rpath/$dylib_name" "$dylib" 2>/dev/null || true

                    # Add rpath to find other dylibs in the same directory
                    sudo install_name_tool -add_rpath @loader_path/ "$dylib" 2>/dev/null || true

                    # Fix references to build machine paths
                    otool -L "$dylib" 2>/dev/null | grep -E "runner|build|SDK" | awk '{print $1}' | while read -r dep; do
                        dep_name=$(basename "$dep")
                        echo "  Fixing dependency: $dep -> @rpath/$dep_name"
                        sudo install_name_tool -change "$dep" "@rpath/$dep_name" "$dylib" 2>/dev/null || true
                    done
                fi
            done

    - name: Code Sign Application (for Sequoia compatibility)
      run: |
            echo "=== Code Signing for macOS Sequoia Compatibility ==="
            
            # Debug: Show app bundle structure
            echo "App bundle structure:"
            find ${{github.workspace}}/bin/QtMeshEditor.app -type f -name "Qt*" | head -20
            echo ""
            echo "Framework structure:"
            ls -la ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/ || echo "No Frameworks directory"
            ls -la ${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/QtCore.framework/ || echo "No QtCore.framework"
            
            # Simplified signing approach - sign everything we can find
            echo "=== Signing all binaries in app bundle ==="
            
            # Sign Qt frameworks - try both versioned and direct paths
            echo "Signing Qt frameworks..."
            for framework in QtCore QtGui QtWidgets QtDBus QtQuickWidgets QtQuick QtQml QtQmlModels QtQmlMeta QtNetwork QtOpenGL QtQuickControls2 QtQuickDialogs2 QtQuickTemplates2 QtLabsPlatform QtQmlCore QtQmlWorkerScript; do
                framework_path="${{github.workspace}}/bin/QtMeshEditor.app/Contents/Frameworks/${framework}.framework"
                if [ -d "$framework_path" ]; then
                    echo "Processing $framework framework..."
                    
                    # Try to sign the versioned executable
                    if [ -f "$framework_path/Versions/Current/$framework" ]; then
                        echo "Signing versioned executable: $framework_path/Versions/Current/$framework"
                        sudo codesign --force --sign - "$framework_path/Versions/Current/$framework" 2>/dev/null || echo "Failed to sign versioned executable"
                    fi
                    
                    # Try to sign the direct executable
                    if [ -f "$framework_path/$framework" ]; then
                        echo "Signing direct executable: $framework_path/$framework"
                        sudo codesign --force --sign - "$framework_path/$framework" 2>/dev/null || echo "Failed to sign direct executable"
                    fi
                    
                    # Sign the framework bundle (this is the most important)
                    echo "Signing framework bundle: $framework_path"
                    sudo codesign --force --sign - "$framework_path" 2>/dev/null || echo "Failed to sign framework bundle"
                else
                    echo "Framework $framework not found"
                fi
            done
            
            # Sign all dylibs in the app bundle
            echo "Signing dynamic libraries..."
            find ${{github.workspace}}/bin/QtMeshEditor.app -name "*.dylib" -type f | while read -r dylib; do
                echo "Signing dylib: $dylib"
                sudo codesign --force --sign - "$dylib" 2>/dev/null || echo "Failed to sign $dylib"
            done
            
            # Sign all executables in the app bundle
            echo "Signing executables..."
            find ${{github.workspace}}/bin/QtMeshEditor.app -type f -perm /111 | while read -r exec_file; do
                # Skip if it's a directory or symlink
                if [ -f "$exec_file" ] && [ ! -L "$exec_file" ]; then
                    # Check if it's a binary file (not a script)
                    if file "$exec_file" | grep -q -E "(Mach-O|executable|shared library)"; then
                        echo "Signing executable: $exec_file"
                        sudo codesign --force --sign - "$exec_file" 2>/dev/null || echo "Failed to sign $exec_file"
                    fi
                fi
            done
            
            # Sign the main executable specifically
            echo "Signing main executable..."
            main_exec="${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/QtMeshEditor"
            if [ -f "$main_exec" ]; then
                echo "Signing main executable: $main_exec"
                sudo codesign --force --sign - "$main_exec" || echo "Failed to sign main executable (non-fatal)"
            else
                echo "Main executable not found at $main_exec"
                ls -la ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/
            fi
            
            # Finally sign the entire app bundle
            echo "Signing app bundle..."
            sudo codesign --force --sign - ${{github.workspace}}/bin/QtMeshEditor.app || echo "Failed to sign app bundle (non-fatal)"
            
            echo "Code signing process completed"
            
            # Verify the signing
            echo "Verifying code signature..."
            codesign --verify --verbose ${{github.workspace}}/bin/QtMeshEditor.app || echo "Verification failed (non-fatal)"
            
    - name: Verify App Bundle
      run: |
            # Verify the app bundle structure
            ls -la ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/
            file ${{github.workspace}}/bin/QtMeshEditor.app/Contents/MacOS/QtMeshEditor

    - name: Pack
      run: | 
            brew install create-dmg
            sudo create-dmg \
            --volname "QtMeshEditor Installer" \
            --volicon "${{github.workspace}}/resources/icon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "QtMeshEditor.app" 200 190 \
            --app-drop-link 600 185 \
            QtMeshEditor-${{github.ref_name}}-MacOS.dmg \
            ${{github.workspace}}/bin/QtMeshEditor.app
    
    - if: github.event_name == 'release' && github.event.action == 'published'
      uses: actions/upload-artifact@v4
      with:
        name: QtMeshEditor-MacOS
        path: ${{github.workspace}}/QtMeshEditor-${{github.ref_name}}-MacOS.dmg
        
    - if: github.event_name == 'release' && github.event.action == 'published'
      uses: xresloader/upload-to-github-release@main
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          file: QtMeshEditor-${{github.ref_name}}-MacOS.dmg
          update_latest_release: true
          overwrite: false
          verbose: true

####################################################################
# Update Homebrew Cask after macOS release
####################################################################

 update-homebrew-cask:
    needs: build-macos
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - name: Wait for DMG to be available
      run: |
        echo "Waiting for DMG to be uploaded to release..."
        sleep 30

    - name: Download DMG from release
      run: |
        VERSION="${{ github.ref_name }}"
        DMG_URL="https://github.com/fernandotonon/QtMeshEditor/releases/download/${VERSION}/QtMeshEditor-${VERSION}-MacOS.dmg"
        echo "Downloading DMG from: $DMG_URL"

        # Retry download up to 5 times with increasing delays
        for i in 1 2 3 4 5; do
          if curl -L -f -o QtMeshEditor.dmg "$DMG_URL"; then
            echo "Download successful"
            break
          else
            echo "Download attempt $i failed, waiting..."
            sleep $((i * 30))
          fi
        done

        if [ ! -f QtMeshEditor.dmg ]; then
          echo "Failed to download DMG after all retries"
          exit 1
        fi

    - name: Calculate SHA256
      id: sha256
      run: |
        SHA256=$(shasum -a 256 QtMeshEditor.dmg | awk '{print $1}')
        echo "SHA256: $SHA256"
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT

    - name: Clone Homebrew tap repository
      run: |
        git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/fernandotonon/homebrew-qtmesheditor.git
        cd homebrew-qtmesheditor
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

    - name: Update Cask file
      run: |
        VERSION="${{ github.ref_name }}"
        SHA256="${{ steps.sha256.outputs.sha256 }}"
        CASK_FILE="homebrew-qtmesheditor/Casks/qtmesheditor.rb"

        echo "Updating cask to version $VERSION with SHA256 $SHA256"

        # Update version (Homebrew cask uses single quotes)
        sed -i "s/version '.*'/version '$VERSION'/" "$CASK_FILE"

        # Update sha256 (Homebrew cask uses single quotes)
        sed -i "s/sha256 '.*'/sha256 '$SHA256'/" "$CASK_FILE"

        echo "Updated cask file:"
        cat "$CASK_FILE"

    - name: Commit and push changes
      run: |
        cd homebrew-qtmesheditor
        git add Casks/qtmesheditor.rb
        git commit -m "Update QtMeshEditor to ${{ github.ref_name }}" || echo "No changes to commit"
        git push