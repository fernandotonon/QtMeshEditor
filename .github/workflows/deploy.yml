    InstallerSha256: $sha256
ManifestType: installer
ManifestVersion: 1.12.0
"@ | Set-Content "$manifestDir\FernandoTonon.QtMeshEditor.installer.yaml" -Encoding UTF8

          # locale.en-US.yaml
          @"
