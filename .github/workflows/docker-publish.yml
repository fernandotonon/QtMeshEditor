name: Docker Publish (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build from (e.g. 2.11.1). Leave empty for latest.'
        required: false
        default: ''

env:
  REGISTRY_GHCR: ghcr.io
  GHCR_IMAGE: fernandotonon/qtmesh
  DOCKERHUB_IMAGE: fernandotr1/qtmesh

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download .deb from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$TAG" = "latest" ]; then
            gh release download --pattern "*.deb" --dir .
          else
            gh release download "$TAG" --pattern "*.deb" --dir .
          fi
          # Ensure exactly one .deb and rename to deterministic filename
          shopt -s nullglob
          debs=(./*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb, found ${#debs[@]}" >&2
            ls -la ./*.deb 2>/dev/null || true
            exit 1
          fi
          mv "${debs[0]}" ./qtmesheditor.deb
          ls -la ./qtmesheditor.deb

      - name: Extract version from downloaded package
        id: version
        run: |
          VERSION=$(dpkg-deb -f ./qtmesheditor.deb Version | sed 's/-.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          TAGS="${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:${VERSION}"
          # Only tag :latest for unversioned dispatch (avoids overwriting latest with old version)
          if [ "$TAG" = "latest" ]; then
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:latest"
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:${VERSION}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=qtmesh
            org.opencontainers.image.description=qtmesh CLI - 3D mesh conversion, optimization, and animation tools
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/fernandotonon/QtMeshEditor

      - name: Verify image
        run: |
          docker run --rm "${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}" --help
